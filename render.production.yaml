# ==============================================================================
# PRIMARY PRODUCTION RENDER BLUEPRINT (`render.production.yaml`)
# Zero Cold-Starts, Dedicated BullMQ Pack & Import Worker, Persistent PostGIS,
# Shared Crypto Secrets (`JWT_SECRET` + `DEV_MASTER_KEY_HEX`), and Exact CORS
# wired to Render's `*.onrender.com` service hosts out-of-the-box.
# ==============================================================================

envVarGroups:
  - name: itinbee-shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MASTER_KEY_HEX
        generateValue: true

databases:
  - name: itinbee-db
    databaseName: itinbee_prod
    user: itinbee_app
    plan: basic-256mb
    region: singapore

services:
  # 1. Always-On Fastify API + SSE + Authenticated WebSocket Service
  - type: web
    name: itinbee-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - fromGroup: itinbee-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: RUN_INLINE_WORKER
        value: "false"
      - key: APP_PUBLIC_URL
        fromService:
          type: web
          name: itinbee-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: itinbee-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: itinbee-frontend
          property: host
      - key: PUBLIC_BACKEND_HOST
        fromService:
          type: web
          name: itinbee-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: itinbee-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: itinbee-kv
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: RAILRADAR_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Itinbee <onboarding@resend.dev>"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_VAULT_REGION
        value: ap-south-1
      - key: AWS_S3_VAULT_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: KMS_KEY_ID
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GCP_VERTEX_LOCATION
        value: asia-south1

  # 2. Dedicated Background Worker (Destination Pack Builder + Ticket Ingestion)
  - type: worker
    name: itinbee-worker
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - fromGroup: itinbee-shared-secrets
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: RAILRADAR_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: itinbee-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: itinbee-kv
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_VAULT_REGION
        value: ap-south-1
      - key: AWS_S3_VAULT_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: KMS_KEY_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  # 3. Always-On Next.js App Router SSR + PWA Frontend (Private Singapore Internal Hop)
  - type: web
    name: itinbee-frontend
    runtime: node
    region: singapore
    plan: starter
    rootDir: frontend
    buildFilter:
      paths:
        - frontend/**
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: itinbee-frontend
          property: host
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: itinbee-backend
          property: hostport
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: itinbee-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_BACKEND_HOST
        fromService:
          type: web
          name: itinbee-backend
          property: host
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false

  # 4. Persistent Redis Key Value
  - type: keyvalue
    name: itinbee-kv
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
